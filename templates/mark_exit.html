{% extends "base.html" %}
{% block title %}Mark Exit{% endblock %}
{% block content %}
<div class="card">
    <h2>Mark Exit</h2>
    <p>This camera connects directly to a phone streaming RTSP (e.g. the "IP Webcam" app) — no browser webcam is used here.</p>

    <div class="rtsp-controls">
        <label for="rtspUrl">RTSP URL</label>
        <input type="text" id="rtspUrl" placeholder="rtsp://192.168.1.5:8080/h264_ulaw.sdp" style="width: 100%; max-width: 420px;">
        <div style="margin-top: 10px;">
            <button id="startExitCam" class="btn primary">▶ Start Exit Camera</button>
            <button id="stopExitCam" class="btn danger">⏹ Stop</button>
        </div>
    </div>

    <div id="exitCamStatus" class="info" style="margin-top: 12px;">Exit camera not started yet.</div>

    <div id="exitDetails"></div>
    <div id="attendanceResult"></div>
</div>
<script src="{{ url_for('static', filename='exit.js') }}"></script>
{% endblock %}
